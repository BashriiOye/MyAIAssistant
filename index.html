<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A0F1D">
    <title>Maya AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0A0F1D; color: white; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px; text-align: center; background: #121A2F; font-weight: bold; font-size: 1.2rem; color: #4A90E2; border-bottom: 1px solid #1E293B; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: #4A90E2; color: white; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: #1E293B; color: #E2E8F0; border-bottom-left-radius: 4px; }
        .input-area { display: flex; padding: 15px; background: #121A2F; border-top: 1px solid #1E293B; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 24px; border: 1px solid #1E293B; background: #0A0F1D; color: white; outline: none; }
        input:focus { border-color: #4A90E2; }
        button { padding: 14px 20px; border-radius: 24px; border: none; background: #4A90E2; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #357ABD; }
    </style>
</head>
<body>
    <header>Maya AI Assistant</header>
    <div id="chat">
        <div class="msg ai">Assalam o Alaikum! I am Maya. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Maya anything..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("userInput");

        function sendMessage() {
            const text = input.value.trim();
            if (text === "") return;
            
            // Add user message
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;
            
            // Simulate AI thinking
            setTimeout(() => {
                chat.innerHTML += `<div class="msg ai">I heard you say: "${text}". (AI connection coming soon!)</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
